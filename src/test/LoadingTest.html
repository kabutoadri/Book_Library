
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test du chargement Vue 3</title>

    <!-- Charge Vue 3 depuis un CDN, sans serveur local. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <link rel="stylesheet" href="../../css/styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e5e7eb;
            border-top-color: #486b56;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Test du composant LoadingSpinner</h1>

        <!-- Bouton déclenchant notre chargement fictif. -->
        <button @click="tester" :disabled="loading">
            {{ loading ? 'Chargement...' : 'Lancer le test' }}
        </button>

        <!-- Affichage du composant de chargement. -->
        <loading-spinner
            :loading="loading"
            message="Recherche en cours..."
            :delay="300"
        ></loading-spinner>

        <!-- Résultat affiché après le chargement. -->
        <p>{{ resultat }}</p>
    </div>

    <script>
        // Récupère les fonctionnalités de Vue 3.
        const { createApp, ref, watch, defineComponent, h, onUnmounted } = Vue;

        // Composant de chargement autonome pour ce test.
        const LoadingSpinner = defineComponent({
            props: {
                loading: Boolean,
                message: {
                    type: String,
                    default: 'Chargement en cours...'
                },
                delay: {
                    type: Number,
                    default: 300
                }
            },

            setup(props) {
                const visible = ref(false);
                let timer = null;

                // Surveille les changements de l'état loading.
                watch(() => props.loading, (isLoading) => {
                    clearTimeout(timer);

                    if (isLoading) {
                        timer = setTimeout(() => {
                            visible.value = true;
                        }, props.delay);
                    } else {
                        visible.value = false;
                    }
                }, { immediate: true });

                // Nettoie le timer lorsque le composant est détruit.
                onUnmounted(() => clearTimeout(timer));

                return () => visible.value
                    ? h('div', { class: 'loading-container' }, [
                        h('div', { class: 'loading-spinner' }),
                        h('p', { class: 'loading-message' }, props.message)
                    ])
                    : null;
            }
        });

        // Création de l'application de test.
        const app = createApp({
            setup() {
                const loading = ref(false);
                const resultat = ref('');

                // Simule un chargement de 3 secondes.
                async function tester() {
                    loading.value = true;
                    resultat.value = '';

                    await new Promise(resolve => setTimeout(resolve, 3000));

                    loading.value = false;
                    resultat.value = 'Chargement terminé !';
                }

                return { loading, resultat, tester };
            }
        });

        // Enregistre notre composant.
        app.component('loading-spinner', LoadingSpinner);

        // Démarre l'application.
        app.mount('#app');
    </script>
</body>
</html>
